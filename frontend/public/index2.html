<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conversational Assessment</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 40rem;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.5;
        color: #1a1a1a;
      }
      code { background: #f0f0f0; padding: 0.1em 0.3em; border-radius: 3px; }
      #status { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Conversational Assessment</h1>
    <p>Frontend placeholder — served as static files from <code>/convo/</code>.</p>
    <p>Backend health check: <span id="status">checking…</span></p>

    <script>
      // Relative path resolves to /convo/api/health behind Apache.
      fetch('api/health')
        .then((r) => r.json())
        .then((d) => {
          document.getElementById('status').textContent = d.ok
            ? 'OK ✓ (' + d.service + ')'
            : 'unexpected response';
        })
        .catch(() => {
          document.getElementById('status').textContent = 'unreachable ✗';
        });
    </script>

    <form id="dataForm">
      <label for="input">input:</label>
      <input type="text" id="input" name="input" />
      <button type="submit">Submit</button>
    </form>

    <!-- This is where the backend message will show up -->
    <div id="result"></div>

    <script>
    document.getElementById('dataForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Stops the page from reloading

        // 1. Get the text from the input box directly
        const inputField = document.getElementById('input');
        const userInputValue = inputField.value;

        // 2. Create a clean JavaScript object matching what Flask wants
        const dataToSend = {
            input: userInputValue
        };

        // 3. Send the data as JSON
        fetch('api/health', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify(dataToSend) // Turns the object into a JSON string
        })
        .then(res => {
            if (!res.ok) {
                throw new Error('Server returned an error');
            }
            return res.json();
        })
        .then(data => {
            // 4. Put the backend message on the screen
            document.getElementById('result').textContent = data.server_message + " - You sent: " + data.you_sent;
        })
        .catch(err => {
            console.error("Error:", err);
            document.getElementById('result').textContent = "Failed to send data to backend.";
        });
    });
    </script>


  </body>
</html>
