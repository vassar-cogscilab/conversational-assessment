<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CourseKata AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="header-left">
        <h1>{KATALLM}</h1>
      </div>
      <div class="header-right">
        <a id="student-press">Student</a>
        <a id="instructor-press" href="instructor.html">Instructor</a>
      </div>
    </header>
    <section id="chat"></section>
    <div id="instructor-panel" hidden>
      <h2>Instructor View</h2>
      <div id="summary-content">Submit a student response to see the evaluation summary.</div>
    </div>
    <form id="form">
      <textarea id="input" placeholder="Type your answer here..." name="input"></textarea>
      <button type="submit" id="submit-btn">Submit</button>
      <button id="clear-btn">New Chat</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
