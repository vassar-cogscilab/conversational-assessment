<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CourseKata AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
        display:block;
        min-height:100%;
        grid-template-rows:auto;
        grid-template-columns:1fr;
        font-family:Arial,Roboto,sans-serif;
        font-size:16px;
        line-height:1.2;
        overflow: hidden;
    }

    .app {
      width: min(900px, 100%);
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    header {
      padding: 22px 22px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left h1 {
      margin: 0;
      font-size: 3em;
      line-height: 1.25;
      color: #0096d9;
      cursor: default;
      font-family: Inter,Roboto,Helvetica Neue,Arial Nova,Nimbus Sans,Arial,sans-serif;
    }

    .header-right {
      display: flex;
      column-gap: 20px;
      flex-direction: row;
    }

     #student-press{
      font-size:30px;
      font-weight:600;
      color: #0096d9;
      transition-timing-function:ease;
      transition-duration:.4s;
      font-family: Inter,Roboto,Helvetica Neue,Arial Nova,Nimbus Sans,Arial,sans-serif;
    }

    #student-press:hover{
      color: rgb(165, 123, 208);
      box-shadow: 0px 3px 0px 0px rgb(165, 123, 208);
      transition-timing-function:ease;
      transition-duration:.4s;
      cursor: pointer;
    }
    
    #instructor-press{
      font-size:30px;
      color: #0096d9;
      transition-timing-function:ease;
      transition-duration:.4s;
      cursor: pointer;
      font-family: Inter,Roboto,Helvetica Neue,Arial Nova,Nimbus Sans,Arial,sans-serif;
    }

    #instructor-press:hover {
      color: #a57bd0;
      font-weight:400;
      box-shadow: 0px 3px 0px 0px rgb(165, 123, 208);
      transition-timing-function:ease;
      transition-duration:.4s;
      }

    #clear-btn {
      width: auto;
      font-family: Inter,Roboto,Helvetica Neue,Arial Nova,Nimbus Sans,Arial,sans-serif;
      padding: 6px 14px;
      font-size: 13px;
      background: #b1b1b1;
      color: #000000;
      border-radius: 6px;
      transition-timing-function:ease;
      transition-duration:.2s;
      cursor: pointer;
    }
    #clear-btn:hover { 
      background: #000000; 
      color: #ffff;
      transition-timing-function:ease;
      transition-duration:.2s;
      scale: 105%
    }
    
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background-color: #f1f1f1;
      border-radius: 15px;
    }

    .message {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 8px;
      line-height: 1.45;
      white-space: pre-wrap;
      font-size: 15px;
      word-wrap:break-word;
    }

        /* Keyframes to slide and fade in */
    @keyframes slideUpFadeUser {
      0% {
        opacity: 0;
        transform: translateY(100%) scale(0.95);
      }
      50% {
        opacity: 1;
        transform: translateY(0) scale(1);
        box-shadow: 0px 0px 0px 0px rgb(0 74 110 / 1);
      }
      100% {
        box-shadow: 6px 0px 0px 0px rgb(0 74 110 / 1);
      }
    }

      @keyframes slideUpFadeAssistant {
      0% {
        opacity: 0;
        transform: translateY(100%) scale(0.95);
      }
      50% {
        opacity: 1;
        transform: translateY(0) scale(1);
        box-shadow: 0px 0px 0px 0px rgb(96, 96, 96);
      }
      100% {
        box-shadow: -6px 0px 0px 0px rgb(96, 96, 96);
      }
    }

    .assistant {
      align-self: flex-start;
      background: #cbcbcb;
      animation: slideUpFadeAssistant 0.8s ease-in-out forwards;
    }

    .user {
      align-self: flex-end;
      background: #0096d9;
      color: #ffffff;
      animation: slideUpFadeUser 0.8s ease-in-out forwards;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 14px;
      padding-bottom: 20px;
      background: #ffffff;
      /*transform: translateY(-400%) scale(125%);*/
    }
  /* adds input bar animation
      form.is-animated {
        animation: comefromMiddle 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
      }
        
      @keyframes comefromMiddle {
        from {
          transform: translateY(-400%) scale(125%);
        }
        to {
          transform: translateY(0) scale(1);
        }
      }
  */
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 140px;
      padding: 12px;
      border: 2px solid #0096d9;
      border-radius: 8px;
      transition-timing-function:ease;
      transition-duration:.2s;
      font-family: Inter,Roboto,Helvetica Neue,Arial Nova,Nimbus Sans,Arial,sans-serif;
      resize: none;
      font-size: 15px
    }
    
    textarea:focus{
      outline: none;
      border: 2px solid #a57bd0;
      transition-timing-function:ease;
      transition-duration:.2s;
    }

    button {
      width: 92px;
      border: 0;
      border-radius: 8px;
      font-family: Inter,Roboto,Helvetica Neue,Arial Nova,Nimbus Sans,Arial,sans-serif;
      background: #0096d9;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #a57bd0;
      color: #ffffff;
      transition-timing-function:ease;
      transition-duration:.2s;
      scale: 105%;
    }

    button:active {
      scale: 95%;
    }

    button:disabled {
      background: #98a2b3;
      cursor: wait;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="header-left">
        <h1>{KATALLM}</h1>
      </div>
      <div class="header-right">
        <a id="student-press">
          Student
        </a>
        <a id="instructor-press"> 
          Instructor
        </a>
      </div>
    </header>
    <section id="chat">
      <div class="message assistant">Everyone thinks of the mean as the central tendency or average, but explain what it is for the mean to be a model?</div>
    </section>
    <form id="form">
      <textarea id="input" placeholder="Type your answer here..." name="input" ></textarea>
      <button type="submit" id="submit-btn">Submit</button>
      <button id="clear-btn">New Chat</button>
    </form>
  </main>

  <script>
    // 1. Get the elements from the screen
    let currentTurns = 0;
    const userInstruction = "Silently assess the student's understanding according to the workflow. If the student has shown strong understanding of at least 3 different topics, provide the final assessment summary. Otherwise, respond naturally in 15 to 50 words and ask only one adaptive follow-up question. Do not show internal assessments, round numbers, workflow details, or labels.";
    const wrap_up = "Begin finishing this conversation";
    
    const chatContainer = document.getElementById("chat");
    const chatForm = document.getElementById("form");
    const inputField = document.getElementById("input");
    const submitBtn = document.getElementById("submit-btn");
    const clearBtn = document.getElementById("clear-btn");
    let localHistory = [];

    // 1. Grab the initial message from your HTML code
    const initialDiv = document.querySelector("#chat .message.assistant");
    const initialText = initialDiv.textContent;
    
    // 2. Put it inside your history array
    localHistory.push({ role: "assistant", content: initialText });

    function appendMessage(role, content) {
      const message = document.createElement("div");
      message.className = "message " + role;
      message.textContent = content;
      chat.appendChild(message);
      chat.scrollTo({
        top: chat.scrollHeight,
        behavior: "smooth"
      });

      // Save using "chat_history"
      localHistory.push({ role, content });
      localStorage.setItem("chat_history", JSON.stringify(localHistory));
    }

    window.onload = function() {
      // Load using the exact same key name: "chat_history"
      const storedChats = localStorage.getItem('chat_history');

      if (storedChats) {
        // Fill the correct variable name: localHistory
        localHistory = JSON.parse(storedChats);
        
        // Temporarily empty the array during the loop so we don't double-save
        const temporaryArray = [...localHistory];
        localHistory = []; 
        chat.innerHTML = "";

        // Loop through and use the correct properties: msg.role and msg.text
        temporaryArray.forEach(function(msg) {
        appendMessage(msg.role, msg.content);
        });
      }
    };
  
    inputField.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault(); // Prevent default newline behavior
            submitBtn.click(); // Trigger the form's submit event
        }
      });
      
    function clearChatHistory() {
      // 1. Wipe the browser's saved memory
      localStorage.removeItem("chat_history");

      // 2. Reset the JavaScript array back to empty
      localHistory = [];

      // 3. Clear all the message boxes off the screen
      chat.innerHTML = "";
    }

    // 3. Handle form submission
    chatForm.addEventListener('submit', function(event) {
        event.preventDefault(); // Stop page from reloading

        const userInputValue = inputField.value;
        if (!userInputValue) return; // Do nothing if field is empty

        // Put the user's message on the screen right away
        appendMessage("user", userInputValue);

        const fullHistory = [...localHistory];

        lastIndex = fullHistory.length - 1;

        if (currentTurns <= 7) fullHistory[lastIndex] = ({ role: "user", content: userInputValue + "\n" + userInstruction });
        
        if (currentTurns > 7) fullHistory[lastIndex] = ({ role: "user", content: userInputValue + "\n" + userInstruction + "\m" + wrap_up });

        if (currentTurns == 9) fullHistory[lastIndex] = ({ role: "user", content: userInputValue + "\n" + "respond to the user but then YOU MUST say goodbye" });

        // Clear the input box and disable the button while loading
        inputField.value = "";
        submitBtn.disabled = true;

        // Build the clean JSON object matching your Flask setup
        const dataToSend = {
            input: userInputValue,
            readMessages: localHistory,
            messages: fullHistory,
            turns: currentTurns
        };

        console.log(localHistory);
        /* adds animation to form
        if(currentTurns === 1){
          chatForm.classList.add('is-animated');
        }
        */

        // Send the data to your backend
        fetch('http://127.0.0.1:3001/string', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify(dataToSend)
        })
        .then(res => {
            if (!res.ok) {
                throw new Error('Server returned an error');
            }
            return res.json();
        })
        .then(data => {
            // Read your server properties. Adjust data.server_message if your Flask returns a different key name (like data.response).
            const aiResponse = data.server_message || data.response || "No response field found in server data.";
            appendMessage("assistant", aiResponse);
        })
        .catch(err => {
            console.error("Error:", err);
            appendMessage("assistant", `Error: Could not reach the backend AI server. ${currentTurns}`);
        })
        .finally(() => {
            // Re-enable the button so the user can type again
            submitBtn.disabled = false;
            inputField.focus();
        });
        currentTurns++;
    });

    // 4. Handle "New Chat" button click
    clearBtn.addEventListener("click", function() {
        const confirmNewChat = confirm("Are you sure you want to start a new chat? Your current session will be cleared.");
        clearChatHistory()
    
    // If the user clicks 'Cancel', stop the action
      if (!confirmNewChat) {
        event.preventDefault(); 
      }
        chatContainer.innerHTML = '<div class="message assistant">Everyone thinks of the mean as the central tendency or average, but explain what it is for the mean to be a model?</div>';
        localHistory.push({ role: "assistant", content: initialText });
        currentTurns = 8;
    });
  </script>
</body>
</html>
