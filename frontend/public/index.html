<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conversational Assessment</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 40rem;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.5;
        color: #1a1a1a;
      }
      code { background: #f0f0f0; padding: 0.1em 0.3em; border-radius: 3px; }
      #status { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Conversational Assessment</h1>
    <p>Frontend placeholder — served as static files from <code>/convo/</code>.</p>
    <p>Backend health check: <span id="status">checking…</span></p>

    <script>
      // Relative path resolves to /convo/api/health behind Apache.
      fetch('api/health')
        .then((r) => r.json())
        .then((d) => {
          document.getElementById('status').textContent = d.ok
            ? 'OK ✓ (' + d.service + ')'
            : 'unexpected response';
        })
        .catch(() => {
          document.getElementById('status').textContent = 'unreachable ✗';
        });
    </script>

    <form id="myForm">
      <label for="input">input:</label>
      <input type="text" id="input" name="input" />

      <button type="submit">Submit</button>
    </form>
   
   <script>
      document.getElementById('myForm').addEventListener('submit', async function(e) {
      e.preventDefault(); // Prevents the default page refresh

      // Gather the form data
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      try {
        // Send data to the backend
        const response = await fetch('/get-string', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json' // Tells the server we are sending JSON
        },
        body: JSON.stringify(data) // Converts JS object to a string
        });

        const result = await response.json();
        console.log('Success:', result);
        } catch (error) {
        console.error('Error sending data:', error);
        }
      });
    </script>
  </body>
</html>
