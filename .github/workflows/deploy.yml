name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys run at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Static frontend artifact to upload. Change to "frontend/dist" once a
  # bundler is added (and uncomment the build step below).
  FRONTEND_SRC: frontend/public
  REMOTE_FRONTEND: /var/www/html/convo
  REMOTE_BACKEND: /home/ec2-user/convo-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Build the frontend (enable once you adopt a bundler) ---
      # Make sure the build is configured with base path "/convo/"
      # (Vite: base: '/convo/'  |  CRA: "homepage"  |  Next: basePath) and
      # emits to frontend/dist. Then set FRONTEND_SRC: frontend/dist above.
      #
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #     cache: npm
      #     cache-dependency-path: frontend/package-lock.json
      # - run: npm --prefix frontend ci
      # - run: npm --prefix frontend run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy frontend (static files)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            "${FRONTEND_SRC}/" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${REMOTE_FRONTEND}/"

      - name: Deploy backend
        run: |
          rsync -az --delete --exclude node_modules \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${REMOTE_BACKEND}/"

      - name: Install deps and (re)start backend
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -lc '
              set -e
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
              cd '"${REMOTE_BACKEND}"'
              if [ -f package-lock.json ]; then npm ci --omit=dev; fi
              pm2 startOrReload ecosystem.config.js --update-env
              pm2 save
            '
