name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys run at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Static frontend artifact to upload. Change to "frontend/dist" once a
  # bundler is added (and uncomment the build step below).
  FRONTEND_SRC: frontend/public
  REMOTE_FRONTEND: /var/www/html/convo
  REMOTE_BACKEND: /home/ec2-user/convo-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # --- Build the frontend (enable once you adopt a bundler) ---
      # Make sure the build is configured with base path "/convo/"
      # (Vite: base: '/convo/'  |  CRA: "homepage"  |  Next: basePath) and
      # emits to frontend/dist. Then set FRONTEND_SRC: frontend/dist above.
      #
      # - uses: actions/setup-node@v6
      #   with:
      #     node-version: 22        # match the server's Node 22 LTS
      #     cache: npm
      #     cache-dependency-path: frontend/package-lock.json
      # - run: npm --prefix frontend ci
      # - run: npm --prefix frontend run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy frontend (static files)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            "${FRONTEND_SRC}/" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${REMOTE_FRONTEND}/"

      - name: Deploy backend
        run: |
          rsync -az --delete \
            --exclude venv --exclude __pycache__ --exclude '*.pyc' --exclude .env \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${REMOTE_BACKEND}/"

      - name: Write backend .env on server
        env:
          # Source secret is LLM_API_KEY; written as ANTHROPIC_API_KEY (the var
          # the Anthropic SDK reads by default). Add more vars to the heredoc
          # below as the backend grows.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # RAG embeddings (RAG_5-9/database_engine.py) via Voyage AI.
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::warning::LLM_API_KEY secret is empty; leaving existing .env untouched"
            exit 0
          fi
          if [ -z "$VOYAGE_API_KEY" ]; then
            echo "::warning::VOYAGE_API_KEY secret is empty; RAG embeddings will fail until it's set"
          fi
          # Pipe over stdin (keys never appear in argv) and create with umask 077 (file mode 600).
          {
            printf 'ANTHROPIC_API_KEY=%s\n' "$LLM_API_KEY"
            [ -n "$VOYAGE_API_KEY" ] && printf 'VOYAGE_API_KEY=%s\n' "$VOYAGE_API_KEY"
          } | ssh -i ~/.ssh/deploy_key \
                "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
                "umask 077 && cat > '${REMOTE_BACKEND}/.env'"

      - name: Install deps and (re)start backend
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -lc '
              set -e
              # nvm is sourced so pm2 (a Node tool) is on PATH; the app itself
              # runs on Python via the venv below.
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
              cd '"${REMOTE_BACKEND}"'
              # Create the virtualenv once, then install/upgrade pinned deps.
              if [ ! -d venv ]; then python3 -m venv venv; fi
              ./venv/bin/pip install --quiet --upgrade pip
              ./venv/bin/pip install --quiet -r requirements.txt
              pm2 startOrReload ecosystem.config.js --update-env
              pm2 save
            '

      - name: Health check
        # pm2 can report "online" even when the app crash-loops, so verify the
        # backend actually answers on :3001 before calling the deploy good.
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -lc '
              for i in $(seq 1 10); do
                if curl -fsS localhost:3001/health | grep -q "\"ok\":true"; then
                  echo "backend healthy"; exit 0
                fi
                echo "waiting for backend... ($i)"; sleep 2
              done
              echo "::error::backend did not become healthy on :3001"
              export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
              pm2 logs convo-api --lines 30 --nostream || true
              exit 1
            '
