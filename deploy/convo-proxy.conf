# Apache reverse-proxy for the conversational-assessment backend.
#
# Install on the EC2 box:
#   sudo cp deploy/convo-proxy.conf /etc/httpd/conf.d/
#   sudo apachectl configtest          # MUST say "Syntax OK" before reloading
#   sudo systemctl reload httpd
#
# The frontend is plain static files in /var/www/html/convo and is served
# directly by Apache, so it needs no rule here. mod_proxy is already loaded
# globally (see api-proxy.conf), so we don't re-load it.
#
# Note: /api/ is already used by another app (ursi2024 on :3000); this app
# lives entirely under /convo/, and its API is at /convo/api/ -> :3001.
<IfModule mod_proxy.c>
    ProxyPass        /convo/api/ http://localhost:3001/
    ProxyPassReverse /convo/api/ http://localhost:3001/
</IfModule>
